version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-wallet_db}
      POSTGRES_USER: ${DB_USERNAME:-wallet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wallet_user} -d ${DB_NAME:-wallet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Основное приложение
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-service
    environment:
      # Настройки базы данных
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-wallet_db}
      DB_USERNAME: ${DB_USERNAME:-wallet_user}
      DB_PASSWORD: ${DB_PASSWORD:-wallet_password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      
      # Настройки приложения
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Настройки JPA/Hibernate
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      HIBERNATE_BATCH_SIZE: ${HIBERNATE_BATCH_SIZE:-20}
      
      # Настройки пула соединений
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-20}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-600000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800000}
      DB_LEAK_DETECTION_THRESHOLD: ${DB_LEAK_DETECTION_THRESHOLD:-60000}
      
      # Настройки Liquibase
      LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # PgAdmin для администрирования PostgreSQL (опционально)
  pgadmin:
    profiles:
      - admin
    image: dpage/pgadmin4:latest
    container_name: wallet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - wallet-network
    depends_on:
      - postgres
    restart: unless-stopped

# Тома для хранения данных
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# Сеть для взаимодействия сервисов
networks:
  wallet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
